<html lang="en"><head><meta charset="utf-8">

<title>Unit 8: Having a Lovely Time</title>
<style>
:root{color-scheme:light;--y:#B8860B;--d:#6b4c05;--l:#fff3c4;--ok:#2e7d32;--no:#c62828;--t:#2b2410;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0;background:#fff;color:var(--t);font-family:Georgia,"Times New Roman",serif}
body{display:flex;flex-direction:column;align-items:center}
#bar{width:100%;height:6px;background:var(--l)}#bar i{display:block;height:100%;width:0;background:var(--y);transition:width .3s}
#deck{width:min(98vw,168vh);aspect-ratio:16/9;position:relative;font-size:min(1.7vw,3vh);margin-top:1vh;border:2px solid var(--y);border-radius:6px;overflow:hidden;background:#fff}
section{display:none;position:absolute;inset:0;padding:2.2em 3em;overflow:auto}
section.on{display:block}
h2{margin:0 0 .5em;font-size:1.9em;color:var(--d);border-bottom:.15em solid var(--y);display:inline-block;padding-bottom:.1em}
h3{margin:.2em 0;color:var(--y)}
p{margin:.4em 0;line-height:1.45}
button{font:inherit;font-size:.8em;font-family:system-ui,sans-serif;border:2px solid var(--y);background:#fff;color:var(--d);padding:.35em .9em;border-radius:.5em;cursor:pointer;margin:.15em}
button:hover,button:focus-visible{background:var(--l)}
button.pr{background:var(--y);color:#fff}
.o.sel{background:var(--y);color:#fff}
.it{display:flex;justify-content:space-between;align-items:center;gap:1em;border-bottom:1px solid var(--l);padding:.2em .4em;font-size:.95em}
.it.ok{background:#e4f4e4}.it.no{background:#fbe0e0}
.sh .o.cor{border-color:var(--ok);border-width:3px}
.g2 .g{display:grid;grid-template-columns:1fr 1fr;column-gap:2em}
.sc{font-family:system-ui,sans-serif;font-weight:700;color:var(--d);margin-left:.5em}
.rv .sa{visibility:hidden;color:var(--no)}.rv.on .sa{visibility:visible}.ln{display:inline-block;min-width:55%;border-bottom:2px solid var(--y);min-height:1.3em}.ch{display:flex;flex-direction:column;gap:.5em;margin:.6em 0}
.b{max-width:70%;padding:.55em .9em;border-radius:1.1em;font-size:.95em;line-height:1.35}
.b.l{background:var(--l);border-bottom-left-radius:.2em;align-self:flex-start}
.b.r{background:var(--y);color:#fff;border-bottom-right-radius:.2em;align-self:flex-end}
.cards{display:flex;gap:1.2em;margin:.6em 0}
.card{flex:1;border:2px solid var(--y);border-radius:.8em;padding:.7em;background:var(--l);text-align:center}
.card .e{font-size:3.2em}
.big{font-size:3em;text-align:center;color:var(--d);margin:.5em 0 .2em}
.pc{flex:1;border:2px solid var(--y);border-radius:.6em;padding:.6em .9em;font-size:.72em;line-height:1.4;background:#fffbea}
.pc b{color:var(--d)}
.h{cursor:pointer;border-radius:.2em;padding:0 .1em}.h:hover{background:var(--l)}
.h.sel{text-decoration:underline;text-decoration-thickness:.12em;text-decoration-color:var(--d);background:var(--l)}
.h.ok{background:#cdeccd}.h.no{background:#f7caca}.h.sh[data-c="1"]{background:#cdeccd;text-decoration:underline}
mark{background:transparent;color:inherit}
.nt.on mark.m{background:#ffd54f;font-weight:700}.nt.on mark.m2{background:#ffb74d;font-weight:700}
.box{background:var(--l);border-left:.3em solid var(--y);padding:.5em 1em;margin:.5em 0;border-radius:.3em}
table{border-collapse:collapse;width:100%;font-size:.9em}td,th{border:2px solid var(--y);padding:.4em .7em}th{background:var(--l)}
#nav{width:min(98vw,168vh);display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;padding:.4em 0}
#notes{width:min(98vw,168vh);display:none;background:var(--l);border:2px solid var(--y);border-radius:6px;padding:.8em 1.2em;margin-bottom:1em;font-family:system-ui,sans-serif;font-size:15px;line-height:1.5}
#notes.on{display:block}
input{font:inherit;font-size:1.1em;padding:.4em .7em;border:2px solid var(--y);border-radius:.4em;width:16em;max-width:90%}
.cert{border:.5em double var(--y);padding:1.5em;text-align:center;margin-top:.5em}
.cert .nm{font-size:2.6em;color:var(--d);border-bottom:2px solid var(--y);display:inline-block;padding:0 1em;margin:.3em 0}
@media print{#nav,#notes,#bar,.pb{display:none!important}}
@media(max-width:700px){#deck{font-size:2.2vw}}

ctionary/english/card" target="_blank" rel="noopener" style="color:var(--d)">card</a>, often with a <a href="https://dictionary.cambridge.org/dictionary/english/photograph" target="_blank" rel="noopener" style="color:var(--d)">photograph</a> or <a href="https://dictionary.cambridge.org/dictionary/english/picture" target="_blank" rel="noopener" style="color:var(--d)">picture</a> on one <a href="https://dictionary.cambridge.org/dictionary/english/side" target="_blank" rel="noopener" style="color:var(--d)">side</a>, that can be <a href="https://dictionary.cambridge.org/dictionary/english/sent" target="_blank" rel="noopener" style="color:var(--d)">sent</a> without an <a href="https://dictionary.cambridge.org/dictionary/english/envelope" target="_blank" rel="noopener" style="color:var(--d)">envelope</a></div><p style="font-size:.6em;color:#777">Definition: Cambridge Dictionary</p></div></div>`,

add('Having a Lovely Time',`<p style="font-size:1.2em">Unit 8 · Present continuous for what is happening around now</p><p>Lesson goal: write a postcard about a holiday.</p><p style="margin-top:1.5em">What’s your name?</p><input id="nm" placeholder="Type your name here" autocomplete="off"><p><button class="pr" id="go">Start the lesson</button></p><p id="wm" style="color:var(--no);font-family:system-ui"></p>`,
`<b>Stage: Warm-up and rapport (2–3 min).</b> Greet the learners and have each type a name; it appears on the certificate at the end. Tell them the aim: by the end they can talk about what is happening now and write a holiday postcard. Check the aim by asking, “What do you do on holiday?” Keep it light; do not pre-teach any grammar.`);

add('Introduction: Look at these three people',`<p>What do they usually do in their lives and jobs?</p><div class="cards"><div class="card"><div class="e">🚌</div><b>Steven</b></div><div class="card"><div class="e">🎒</div><b>Judy</b></div><div class="card"><div class="e">📚</div><b>Jamie</b></div></div>${B([['l','Look at these three people. What do they usually do in their lives and jobs?'],['r','Steven is wearing a uniform. I think he drives a bus.'],['l','Good! What about Judy and Jamie?']])}`,
`<b>Stage: Lead-in / schema activation (3–4 min).</b> Learners look at the photos in the book (Steven in a bus, Judy with a backpack, Jamie at a desk). Elicit predictions about jobs and daily lives in pairs, then open class. Accept any sensible guess; do not confirm yet. Model the chat bubbles aloud first, then have pairs repeat with their own ideas. This sets up the reading text and the present simple.`);

add('Task 2: Which person does what?',`<p>Work with a partner. Look at the words below. Choose the person who does each thing.</p>${Q(V.map(([w,a])=>[w,P,a]),'g2')}<p><b>Can you think of any more things they do?</b> Choose a person to see a conversation about their job.</p><div><button class="tb pr" onclick="tab(this,0)">Steven</button><button class="tb" onclick="tab(this,1)">Judy</button><button class="tb" onclick="tab(this,2)">Jamie</button></div><div class="tp">${B([['l','What does Steven do?'],['r','He drives a bus.'],['l','What does he do at work?'],['r','He picks up passengers.'],['l','What does he wear?'],['r','He wears a bus driver’s uniform.']])}</div><div class="tp" style="display:none">${B([['l','What does Judy do?'],['r','She goes to school.'],['l','What does she eat at school?'],['r','She eats school lunch.'],['l','What does she do every night?'],['r','She does homework every night.']])}</div><div class="tp" style="display:none">${B([['l','What does Jamie do?'],['r','He teaches English.'],['l','Who does he help?'],['r','He helps students.'],['l','What does he give them?'],['r','He gives homework.']])}</div>`,
`<b>Stage: Vocabulary pre-teach through matching (5 min).</b> Pairs discuss before choosing. Answers: helps students – Jamie; drives a bus – Steven; teaches English – Jamie; eats school lunch – Judy; picks up passengers – Steven; does homework every night – Judy; goes to school – Judy; wears a bus driver’s uniform – Steven; gives homework – Jamie. Use Check, then Show answers for feedback. Press Try it again so another pair can repeat. Finish with “Can you think of any more things they do?” as a speaking extension. Then use the three tabs (Steven, Judy, Jamie): each has its own short conversation about that person’s job. Model one tab with a confident learner, then pairs read each conversation in role (one asks, one answers), swap roles, and finally close the slide and try to repeat the questions from memory. Listen for the third-person -s/-es in “drives”, “picks up”, “goes”, “does”, “teaches” and “helps”.`);


add('Noticing: vocabulary',`<p>Look at the words. What do you notice about the verbs?</p><div class="nt" id="n1"><div class="g2"><div class="box"><mark class="m">helps</mark> students<br><mark class="m">drives</mark> a bus<br><mark class="m">teaches</mark> English<br><mark class="m">eats</mark> school lunch<br><mark class="m">picks up</mark> passengers</div><div class="box"><mark class="m">does</mark> homework every night<br><mark class="m">goes</mark> to school<br><mark class="m">wears</mark> a bus driver’s uniform<br><mark class="m">gives</mark> homework</div></div><button class="pr" data-a="tg">Highlight the verbs</button><button data-a="tg">Hide highlight</button></div>${B([['l','What do you notice about the verbs?'],['r','They are about he, she or Steven. They are things people usually do.']])}`,
`<b>Stage: Noticing vocabulary (3 min).</b> Press the highlight button so learners see the verb parts. Guide: these are things people <i>usually</i> do (present simple); the subject is one person. Ask learners to say each phrase with “He” or “She”. Revisit the pronunciation of -es endings (teaches, goes, does). Do not over-explain; the grammar appears in Language Focus.`);

add('Task 4: Read and match',`<p>Read the messages from the people in the first activity. Match the pictures with the messages.</p><div class="cards"><div class="pc"><b>Dear Amy,</b><br>I’m having a great time here in Thailand.<br>Right now, I’m writing this postcard and drinking mango juice at the beach! I’m swimming in the beautiful sea and eating lots of fresh fruit. I’m meeting lots of nice people and enjoying my holiday.<br>See you soon!<br>Love Jamie</div><div class="pc"><b>Dear Emma,</b><br>I’m having a wonderful time here. I’m staying in the famous Ritz hotel with my mum and dad. I’m drinking lots of tea and eating scones and cream for lunch every day. I’m going to the theatre every night. There are so many things to do here. London is great!<br>Lots of love<br>Judy</div><div class="pc"><b>Dear Jo,</b><br>I love Canada!<br>I’m hiking and climbing mountains every day. It’s a bit cold so I’m wearing a big jacket and gloves. I love the nature here. It’s so big and wild.<br>I’m travelling to many new places. I’m taking lots of photos! Yesterday I saw a grizzly bear!<br>Wish you were here,<br>Steven</div></div>${Q([['Jamie’s postcard',['a','b','c'],1],['Judy’s postcard',['a','b','c'],2],['Steven’s postcard',['a','b','c'],0]])}`,
`<b>Stage: Reading for gist (5 min).</b> Set a time limit (2 minutes) and one gist task: match each postcard to its picture. Answers: Jamie – b (Thailand); Judy – c (London, UK); Steven – a (Canada). Check in pairs first, then Show answers. Pre-empt unknown words (scones, grizzly bear, gloves) only if they block gist; otherwise leave for later. Learners can confirm their earlier predictions from Task 3.`);

add('Noticing: grammar in the postcards',`<p>Look at the three postcards again. Find the present continuous.</p><div class="nt" id="n3"><div class="cards"><div class="pc"><b>Dear Amy,</b><br>I<mark class="m2">’m</mark> <mark class="m">having</mark> a great time here in Thailand.<br>Right now, I<mark class="m2">’m</mark> <mark class="m">writing</mark> this postcard and <mark class="m">drinking</mark> mango juice at the beach! I<mark class="m2">’m</mark> <mark class="m">swimming</mark> in the beautiful sea and <mark class="m">eating</mark> lots of fresh fruit. I<mark class="m2">’m</mark> <mark class="m">meeting</mark> lots of nice people and <mark class="m">enjoying</mark> my holiday.<br>See you soon!<br>Love Jamie</div><div class="pc"><b>Dear Emma,</b><br>I<mark class="m2">’m</mark> <mark class="m">having</mark> a wonderful time here. I<mark class="m2">’m</mark> <mark class="m">staying</mark> in the famous Ritz hotel with my mum and dad. I<mark class="m2">’m</mark> <mark class="m">drinking</mark> lots of tea and <mark class="m">eating</mark> scones and cream for lunch every day. I<mark class="m2">’m</mark> <mark class="m">going</mark> to the theatre every night. There are so many things to do here. London is great!<br>Lots of love<br>Judy</div><div class="pc"><b>Dear Jo,</b><br>I love Canada!<br>I<mark class="m2">’m</mark> <mark class="m">hiking</mark> and <mark class="m">climbing</mark> mountains every day. It’s a bit cold so I<mark class="m2">’m</mark> <mark class="m">wearing</mark> a big jacket and gloves. I love the nature here. It’s so big and wild.<br>I<mark class="m2">’m</mark> <mark class="m">travelling</mark> to many new places. I<mark class="m2">’m</mark> <mark class="m">taking</mark> lots of photos! Yesterday I saw a grizzly bear!<br>Wish you were here,<br>Steven</div></div><button class="pr" data-a="tg">Highlight be and -ing</button><button data-a="tg">Hide highlight</button><span style="font-size:.75em"> Orange = form of be. Dark yellow = -ing form.</span></div>`,
`<b>Stage: Noticing grammar in the text (4 min).</b> Before pressing the button, ask learners to find actions that are happening now or around now in each postcard. Then reveal the highlighting: I’m + verb-ing (having, writing, swimming, staying, hiking…). Point out that after “and”, the be verb is not repeated (“I’m writing this postcard and drinking mango juice”). Contrast with the present simple in the same texts (“I love Canada”, “It’s a bit cold”), which describe feelings and states rather than actions in progress. Link back to Task 5: Steven normally drives a bus; now he’s hiking and climbing.`);
add('Task 5: Normally and now, on holiday',`<p>Work with a partner. Read Steven’s and Judy’s messages again. Complete the table.</p><table><tr><th></th><th>normally</th><th>now, on holiday</th></tr><tr><td><b>Steven</b></td><td style="color:var(--no)">He drives a bus.</td><td style="color:var(--no)">He’s hiking and climbing mountains.</td></tr><tr><td><b>Judy</b></td><td>?</td><td>?</td></tr></table>${Q([['Judy – normally',['She goes to school.','She drives a bus.','She teaches English.'],0],['Judy – now, on holiday',['She’s hiking and climbing mountains.','She’s staying in the Ritz hotel in London.','She’s swimming in the sea.'],1]])}`,
`<b>Stage: Reading for detail, contrasting present simple and present continuous (5 min).</b> Steven’s row is the example. Pairs decide Judy’s answers (normally: she goes to school; now: staying in the Ritz hotel, drinking tea, going to the theatre). Emphasise the contrast “normally” versus “now” and the verb form: “He drives” versus “He’s hiking”. Feedback: Check, then Show answers; ask learners to justify by pointing to the text.`);

add('Noticing: grammar',`<p>Look at the sentences. Find the form of the present continuous.</p><div class="nt" id="n2"><div class="box">I’m <mark class="m">drinking</mark> mango juice at the beach.<br>I’m <mark class="m">staying</mark> in a hotel.<br><mark class="m2">Are</mark> you <mark class="m">enjoying</mark> the party? Yes, I <mark class="m2">am</mark>. / No, I’m not.<br><mark class="m2">Is</mark> he <mark class="m">working</mark> today? Yes, he <mark class="m2">is</mark>. / No, he <mark class="m2">isn’t</mark>.</div><button class="pr" data-a="tg">Highlight be and -ing</button><button data-a="tg">Hide highlight</button><p style="font-size:.8em">Dark yellow = -ing form. Orange = form of be.</p></div>${B([['l','What do you notice?'],['r','We use am, is or are, and the verb ends in -ing.']])}`,
`<b>Stage: Noticing grammar (3 min).</b> Reveal the highlight after learners tell you what they see. Ask them to find the two parts: be (am/is/are) and the -ing form. Point out that in questions be comes first. Elicit the rule in learners’ words before confirming.`);

add('Language Focus',`<div class="g2"><div class="g"><div><h3>Present simple</h3><p>When we talk about what usually happens in our lives, we use the present simple.</p><div class="box">I <b>work</b> in a company.<br>He <b>drives</b> a bus.<br>She <b>goes</b> to school.</div></div><div><h3>Present continuous</h3><p>1 Talk about what’s happening now.</p><div class="box"><b>be + -ing form of the verb</b><br>I’m drinking mango juice at the beach.</div><p>2 Talk about what is happening around now.</p><div class="box"><b>be + -ing form of the verb</b><br>I’m staying in a hotel.</div></div></div></div><h3>We make questions like this:</h3><div class="box">Are you enjoying the party? Yes, I am. / No, I’m not.<br>Is he working today? Yes, he is. / No, he isn’t.</div>`,
`<b>Stage: Language Focus, clarification (5 min).</b> Meaning: present simple = habits and routines; present continuous = now and around now. Form: be + verb-ing; questions invert the subject and be. Use timelines: a repeated line for “usually”, a single point and a short bracket for “now/around now”. Concept-check: “Is Steven driving a bus now?” (No.) “Does he usually drive a bus?” (Yes.) Pronunciation: contractions I’m, he’s, isn’t. Drill the question and short answers chorally.`);

add('Practice 7: Present continuous sentences',`<p>Write present continuous sentences using the prompts.</p><div class="rv"><div class="it"><span><b>a</b>&nbsp; I / eat / breakfast</span><span class="ln" style="color:var(--no)">I’m eating breakfast.</span></div><div class="it"><span><b>b</b>&nbsp; I / drink / tea</span><span class="ln"><span class="sa">I’m drinking tea.</span></span></div><div class="it"><span><b>c</b>&nbsp; She / do / exercise</span><span class="ln"><span class="sa">She’s doing exercise.</span></span></div><div class="it"><span><b>d</b>&nbsp; I / do / homework</span><span class="ln"><span class="sa">I’m doing homework.</span></span></div><div class="it"><span><b>e</b>&nbsp; I / listen to / music</span><span class="ln"><span class="sa">I’m listening to music.</span></span></div><div class="it"><span><b>f</b>&nbsp; They / cook / dinner</span><span class="ln"><span class="sa">They’re cooking dinner.</span></span></div><div class="it"><span><b>g</b>&nbsp; I / wear / jeans</span><span class="ln"><span class="sa">I’m wearing jeans.</span></span></div><div class="it"><span><b>h</b>&nbsp; He / speak / English</span><span class="ln"><span class="sa">He’s speaking English.</span></span></div><div class="ba"><button data-a="rv" class="pr">Show answers</button><button data-a="rv">Hide answers</button><button data-a="rv">Try it again</button></div></div>${B([['l','I / drink / tea.'],['r','I’m drinking tea.'],['l','Now say a sentence for each prompt. Then press Show answers.']])}`,
`<b>Stage: Controlled practice (6 min).</b> Keep the exercise as in the book: learners build a present continuous sentence from each prompt (a is the example: I’m eating breakfast). In this deck learners say their sentences aloud to a partner instead of writing. Typical errors: missing be, forgetting -ing, using the base form after be. Press Show answers to check, discuss errors, then Hide answers or Try it again so pairs can repeat. Drill the correct sentences chorally for stress and contractions.`);

add('Practice 7: Say three sentences',`<p>Say three sentences about what you are doing now or around now.</p><p>Now: what is happening at this moment. Around now: what is happening in this period of your life, not necessarily at this exact moment.</p>${B([['l','What are you doing now?'],['r','I’m talking to you and looking at my screen.'],['l','And what are you doing around now? What are you doing these days?'],['r','I’m studying for an exam.'],['l','What else are you doing around now?'],['r','I’m learning to drive this month.'],['l','Anything else?'],['r','I’m reading a good book this week. Now tell me three sentences about you!']])}`,
`<b>Stage: Freer practice, spoken (4 min).</b> The book example is “I’m studying for an exam.” This is an around-now sentence: the person may not be studying at this exact moment. Highlight the time phrases that signal around now (these days, this month, this week) and contrast them with now (at this moment). Concept-check: “Are you studying at this exact moment?” (Maybe not.) “Is it a temporary activity in your life?” (Yes.) Learners say three personal sentences to a partner. Monitor and note errors on the board for delayed feedback. Praise accurate contractions and -ing forms.`);

`<b>Stage: Pronunciation, /ʌ/ versus /ɜː/ (5 min).</b> Contrast the short /ʌ/ in shut, hut, cut, bun with the long /ɜː/ in shirt, hurt, curt, burn. Learners listen, choose A or B, then Check. Use the lip and tongue cue: the /ɜː/ sound is longer, with a relaxed centre of the mouth. In pairs, learners take turns to read a word and their partner says A or B (Task 8b). The slide plays the original Track 17 recording; pause and replay as needed. Before class, listen once and confirm the A/B answer key against the recording, and edit the key if the order differs.`);

add('Time to Talk 9a: Imagine you are on holiday',`<p>You want to write a postcard. Talk about your notes with a partner.</p>${B([['l','Who do you want to write the postcard to?'],['r','I want to write to my friend Emi.'],['l','Where are you staying?'],['r','I’m staying in a lovely hotel by the beach.'],['l','What are you doing every day?'],['r','I’m lying by the beach and drinking beer.'],['l','What are you doing now?'],['r','I’m writing a postcard.'],['l','How are you feeling?'],['r','I’m having a lovely time.']])}`,
`<b>Stage: Preparation for the task (4 min).</b> The notes become a speaking rehearsal. Pairs ask and answer the five questions using present continuous. Monitor, support vocabulary, and note errors. The answers in the bubbles are only models; learners should invent their own.`);

add('Time to Talk 9b: You have a problem',`<p>You have hurt your hand, and you can’t write. Ask your partner to write the postcard for you. Take turns to tell your partner what to write.</p>${B([['l','I have a problem. I’ve hurt my hand and I can’t write. Can you write the postcard for me?'],['r','Of course! What should I write?'],['l','Dear Emi, How are you? I’m having a lovely time.'],['l','I’m lying by the beach drinking beer. I’m staying in a lovely hotel by the beach.'],['r','Great, I’m writing it down.']])}`,
`<b>Stage: Productive task, spoken (6–8 min).</b> One learner dictates their postcard from their notes; the partner acts as the “writer” (no writing is required in this deck). Model with the bubbles first (Dear Emi, How are you? I’m having a lovely time…). Monitor and take notes for content and language feedback.`);

add('Time to Talk 9c and Homework',`<p>Read your partner’s postcard to the class.</p>${B([['l','Dear Emi, How are you? I’m having a lovely time. I’m lying by the beach drinking beer. I’m staying in a lovely hotel by the beach.'],['r','Well done! Is the postcard interesting?']])}<div class="box"><b>Homework:</b> turn to page 92.</div>`,
`<b>Stage: Feedback and close (5 min).</b> Pairs perform or read to the class. Give content feedback first, then delayed correction from your notes. Set the homework (page 92). Finally, ask: “What are three things you can say with the present continuous now?”`);

add('Certificate',`<div id="cert"></div>`,`<b>Stage: Closing.</b> The certificate appears when all slides have been visited. Congratulate learners individually.`);

const D=document.getElementById('deck'),vis=new Set();let cur=0,name='';
D.innerHTML=S.map((s,i)=>`<section id="s${i}"><h2>${s[0]}</h2><div>${s[1]}</div></section>`).join('');
function tab(b,i){const w=b.closest('section');w.querySelectorAll('.tp').forEach((e,j)=>e.style.display=j==i?'block':'none');w.querySelectorAll('.tb').forEach((e,j)=>e.classList.toggle('pr',j==i))}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';speechSynthesis.speak(u)}catch(e){}}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));D.querySelectorAll('section').forEach((e,j)=>e.classList.toggle('on',j==cur));vis.add(cur);
document.getElementById('ct').textContent=(cur+1)+' / '+S.length;document.querySelector('#bar i').style.width=(vis.size/S.length*100)+'%';
if(cur==S.length-1){const left=S.length-vis.size;document.getElementById('cert').innerHTML=left>0?`<p>Visit every slide to unlock your certificate. Slides left: ${left}.</p>`:`<div class="cert"><h3>Certificate of Completion</h3><p>This certifies that</p><div class="nm">${(name||'Student').replace(/[<>&]/g,'')}</div><p>has studied Unit 8: Having a Lovely Time<br>(present continuous for what is happening around now).</p><p>${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</p><button class="pb" onclick="print()">Print certificate</button></div>`}}
document.getElementById('nx').onclick=()=>go(cur+1);document.getElementById('pv').onclick=()=>go(cur-1);
document.onkeydown=e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')go(cur+1);if(e.key=='ArrowLeft')go(cur-1)};
document.getElementById('go').onclick=()=>{const v=document.getElementById('nm').value.trim();if(!v){document.getElementById('wm').textContent='Type your name to start.';return}name=v;go(cur+1)};
D.addEventListener('click',e=>{const t=e.target;
if(t.classList.contains('o')){t.parentNode.querySelectorAll('.o').forEach(x=>x.classList.remove('sel'));t.classList.add('sel');return}
if(t.classList.contains('h')){t.classList.toggle('sel');return}
const a=t.dataset.a;if(!a)return;
if(a=='tg'){t.closest('.nt').classList.toggle('on',t.textContent.startsWith('Highlight'));return}
if(a=='rv'){t.closest('.rv').classList.toggle('on',t.textContent=='Show answers');return}
const z=t.closest('.qz,.hq'),sc=z.querySelector('.sc');
if(z.classList.contains('hq')){const hs=[...z.querySelectorAll('.h')];
if(a=='check'){let n=0;hs.forEach(h=>{h.classList.remove('ok','no');const s=h.classList.contains('sel'),c=h.dataset.c=='1';if(s&&c){h.classList.add('ok');n++}else if(s||c)h.classList.add('no')});const tot=hs.filter(h=>h.dataset.c=='1').length;sc.textContent=n+' / '+tot+' correct'}
if(a=='show')hs.forEach(h=>h.classList.add('sh'));if(a=='hide')hs.forEach(h=>h.classList.remove('sh'));
if(a=='retry'){hs.forEach(h=>h.classList.remove('sel','ok','no','sh'));sc.textContent=''}return}
const its=[...z.querySelectorAll('.it')];
if(a=='check'){let n=0;its.forEach(it=>{const i=[...it.querySelectorAll('.o')].findIndex(x=>x.classList.contains('sel')),ok=i==it.dataset.a;it.classList.toggle('ok',ok);it.classList.toggle('no',!ok);if(ok)n++});sc.textContent=n+' / '+its.length+(n==its.length?' Well done!':' Try again or show answers.')}
if(a=='show')its.forEach(i=>i.classList.add('sh'));if(a=='hide')its.forEach(i=>i.classList.remove('sh'));
if(a=='retry'){its.forEach(i=>{i.classList.remove('ok','no','sh');i.querySelectorAll('.o').forEach(x=>x.classList.remove('sel'))});sc.textContent=''}});
go(0);
</script></body></html>
